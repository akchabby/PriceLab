services:
  postgres:
    image: postgres:16-alpine
    container_name: pricelab-postgres
    environment:
      POSTGRES_DB: pricelab
      POSTGRES_USER: pricelab
      POSTGRES_PASSWORD: pricelab
    ports:
      - "5432:5432"
    volumes:
      - pricelab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricelab -d pricelab"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pricelab_postgres_data:

